<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Court Score</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Court Score">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0b0f14; --panel:#131a22; --panel2:#1b2430; --line:#263241;
  --text:#f2f6fa; --muted:#8fa0b3; --a:#3aa0ff; --b:#ff8a3d; --gold:#ffd24a; --danger:#ff4d5e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;height:auto;width:100%;max-width:100vw;overflow:hidden;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.35;cursor:default}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:nowrap;min-width:0}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:9px 14px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted);min-height:40px}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
.status{--H:calc(clamp(22px,4.4vmin,36px) + 16px);flex:1;text-align:center;min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;height:calc(var(--H) + 32px)}
.status .sub:empty{display:none}
.status .sub{width:100%}
.status .main{display:inline-block;max-width:100%;height:var(--H);line-height:var(--H);vertical-align:top;font-weight:700;font-size:clamp(14px,2.2vmin,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .main.hl{padding:0 22px;border-radius:999px;font-weight:800;color:#0b0f14;
  font-size:clamp(22px,4.4vmin,36px);letter-spacing:.02em}
.hl.deuce,.hl.win{background:var(--gold)}
.hl.advA{background:var(--a)}
.hl.advB{background:var(--b)}
.hl.tb{background:#b693ff}
.hl.gp{background:var(--gold)}
.hl.mp{background:var(--danger);color:#fff}
.team.gp{box-shadow:0 0 0 4px var(--gold) inset}
.team.mp{box-shadow:0 0 0 5px var(--danger) inset;animation:mpPulse .9s ease-in-out infinite alternate}
@keyframes mpPulse{from{box-shadow:0 0 0 3px var(--danger) inset}to{box-shadow:0 0 0 9px var(--danger) inset}}
.hl.sd{background:var(--danger);color:#fff}
.status .sub{height:30px;margin-top:2px;display:flex;justify-content:center;align-items:center;gap:6px;overflow:hidden;cursor:pointer}
.pc{background:var(--panel);box-shadow:0 0 0 1px var(--line) inset;border-radius:999px;padding:4px 10px;
  font-size:clamp(11px,1.6vmin,14px);color:var(--muted);white-space:nowrap;font-weight:600}
.pc b{color:var(--text);font-weight:800}
.pc.hot{background:var(--panel2);box-shadow:0 0 0 1px var(--muted) inset}
.tools{display:flex;gap:8px}
.tbtn{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;background:var(--panel);font-weight:600;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 1px var(--line) inset}
.tbtn:active:not(:disabled){background:var(--panel2)}
.tbtn.reset{color:#ffb3ba}
.pc.set{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pc.rot{flex-shrink:0;max-width:55%}
.pc.shuf{flex-shrink:0;color:var(--text);font:inherit;font-size:clamp(11px,1.6vmin,14px);font-weight:800;box-shadow:0 0 0 1px var(--text) inset;cursor:pointer}
.chip,#more{display:none}
.bar{position:relative}
.mpop{display:none;position:absolute;top:calc(100% - 4px);z-index:15;background:var(--panel2);border-radius:14px;padding:5px;min-width:170px;box-shadow:0 0 0 1px var(--line) inset,0 10px 30px rgba(0,0,0,.5)}
.mpop.show{display:block}
.mpop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:0 14px;min-height:46px;border-radius:10px;font-weight:600;font-size:16px}
.mpop button:active{background:var(--panel)}
.mpop button.on{color:var(--text);background:var(--panel)}
.mpop button.dng{color:#ffb3ba}
.mpop .ck{margin-left:auto}

/* board */
.board{display:grid;gap:10px;padding:0 12px 12px;min-height:0;min-width:0}
.board.swap > :first-child{order:2}
@media (orientation:portrait){.board{grid-template-rows:1fr 1fr}}
@media (orientation:landscape){.board{grid-template-columns:1fr 1fr}}

.team{min-width:0;--c:var(--a);background:var(--panel);border-radius:22px;display:grid;grid-template-rows:auto 1fr auto auto;
  padding:clamp(10px,2cqmin,22px);gap:clamp(4px,1cqh,12px);min-height:0;container-type:size;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent) inset;position:relative;overflow:hidden}
.team.b{--c:var(--b)}
.team.won{box-shadow:0 0 0 4px var(--gold) inset}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.name{background:transparent;border:0;color:var(--c);font-weight:800;font-size:clamp(20px,7cqh,40px);
  width:100%;min-width:0;outline:none;padding:4px 0;-webkit-user-select:text;user-select:text;text-overflow:ellipsis}
.name:focus{border-bottom:2px solid var(--c)}
.serve{flex:none;font-size:clamp(11px,3.4cqh,16px);font-weight:700;letter-spacing:.06em;color:var(--muted);
  padding:6px 10px;border-radius:999px;background:var(--panel2);white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.serve.on{background:var(--c);color:#0b0f14;text-transform:uppercase}
.score{display:flex;align-items:center;justify-content:center;font-weight:800;line-height:1;
  font-size:min(46cqw,40cqh);font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-height:0}
.score.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.chips{min-height:calc(clamp(14px,4.4cqh,22px) * 1.25 + 12px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.chip{background:var(--panel2);border-radius:10px;padding:6px 12px;font-size:clamp(12px,3.6cqh,18px);color:var(--muted);font-weight:600}
.chip b{color:var(--text);font-size:1.25em;margin-right:4px}
.setbox{min-width:2.2em;text-align:center;padding:6px 8px;border-radius:10px;background:var(--panel2);font-weight:700;font-size:clamp(14px,4.4cqh,22px)}
.setbox.w{color:var(--c)}
.setbox.cur{outline:2px solid var(--c)}
.add{height:clamp(68px,24cqh,150px);border-radius:18px;background:var(--c);color:#0b0f14;font-weight:800;
  font-size:clamp(20px,8cqh,44px);letter-spacing:.02em}
.add:active:not(:disabled){filter:brightness(.85);transform:scale(.985)}
.add.alt{background:var(--panel2);color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.badge{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(8deg);background:var(--gold);color:#1a1300;
  font-weight:900;letter-spacing:.08em;padding:8px 14px;border-radius:10px;font-size:clamp(14px,5cqh,26px);display:none}
.team.won .badge{display:block}

/* player rotation */
.prow{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;margin:0 0 8px;box-shadow:0 0 0 1px var(--line) inset}
.prow .pg{margin-left:auto;color:var(--muted);font-size:14px}
.pst{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.pst.play{background:var(--text);color:var(--bg)}
.prow.in{padding:6px}
.prow.in .seg.side{flex:0 0 auto;width:auto}
.prow.in .seg.side button{padding:0 10px;min-height:40px;font-size:14px}
.err{color:#ff8b95;font-size:14px;margin:0 0 6px}
.err:empty{display:none}
.opt[hidden]{display:none}
.prow.in input{flex:1;min-width:0;height:44px;border-radius:10px;border:0;background:var(--bg);color:var(--text);padding:0 12px;font:inherit;font-size:16px}
.px{width:44px;height:44px;font-size:26px;color:var(--muted)}
.vs{background:var(--panel2);border-radius:14px;padding:14px;margin:0 0 12px;text-align:center;box-shadow:0 0 0 1px var(--line) inset}
.vs .t{font-weight:800;font-size:18px}
.vs .v{color:var(--muted);font-size:13px;margin:4px 0}
.vs .s{color:var(--muted);font-size:14px;margin-top:8px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.scrim.show{display:flex}
.sheet{background:var(--panel);border-radius:22px;padding:22px;width:min(460px,100%);box-shadow:0 0 0 1px var(--line) inset;max-height:92dvh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:22px}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:15px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:16px;border-radius:14px;background:var(--panel2);margin-bottom:10px;font-weight:700;font-size:17px}
.opt.big{min-height:72px;font-size:20px}
.opt small{display:block;color:var(--muted);font-weight:500;margin-top:3px;font-size:14px}
.opt.danger{color:#ffb3ba}
.opt.ghost{background:transparent;box-shadow:0 0 0 1px var(--line) inset;text-align:center}
.row{margin:14px 0}
.row label{display:block;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.row .seg{width:100%}
.row .seg button{flex:1}
.rules{margin:0 0 14px;padding-left:20px;font-size:16px;line-height:1.4}
.rules li{margin:0 0 6px}
.mh{margin:6px 0 10px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.mc{background:var(--panel2);border-radius:12px;padding:10px 12px;margin:0 0 8px;box-shadow:0 0 0 1px var(--line) inset}
.mc.on{box-shadow:0 0 0 2px var(--a) inset}
.mc.pick{cursor:pointer}
.mc.pick:not(.on):active{background:var(--bg)}
.mc .mt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.mc h3{margin:0;font-size:16px}
.mc p{margin:0;font-size:15px;line-height:1.4;color:var(--text)}
.mc .use{padding:6px 14px;border-radius:999px;background:var(--bg);font-weight:700;font-size:13px;box-shadow:0 0 0 1px var(--line) inset}
.mc .seg{margin-top:8px;width:100%}
.mc .seg button{flex:1;min-height:34px;padding:6px 10px;font-size:14px}
.mc .sel{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--a);color:#0b0f14;font-weight:800;font-size:12px}
#hDone{position:sticky;bottom:-22px;background:var(--panel);padding-top:16px;padding-bottom:16px;box-shadow:0 -14px 14px -6px var(--panel),0 0 0 1px var(--line) inset}
.rules b{color:var(--text)}
.sheet .sub2{color:var(--muted);font-size:14px;margin:0 0 14px}
#help{font-size:20px;font-weight:800}
.stepper{display:flex;gap:8px;margin-top:10px}
.stepper button{width:64px;height:52px;border-radius:12px;background:var(--panel2);font-size:26px;font-weight:700}
.stepper input{flex:1;min-width:0;height:52px;border-radius:12px;border:0;background:var(--bg);color:var(--text);text-align:center;
  font-weight:700;font-size:24px;font-family:inherit;-webkit-user-select:text;user-select:text;box-shadow:0 0 0 1px var(--line) inset}
.hold{position:relative;width:100%;height:68px;border-radius:16px;background:#3a1c22;overflow:hidden;font-weight:800;font-size:18px;
  color:#ffd0d5;margin-bottom:10px;-webkit-touch-callout:none;touch-action:none}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--danger)}
.hold.holding .fill{width:100%;transition:width 1.2s linear}
.hold .lbl{position:relative}
.hold.holding .lbl{color:#fff}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(40px);
  background:var(--panel2);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:20;font-weight:600;box-shadow:0 0 0 1px var(--line) inset;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:600px), (max-height:500px){
  .bar{gap:8px}
  #sportSeg,#help,#settings,#reset,#players,#swap{display:none!important}
  .chip,#more{display:flex}
  .chip{min-width:0;padding:0 12px}
  .chip .car{font-size:12px;color:var(--muted)}
  .tools{display:contents}
  #undo{flex:1;order:2}
  #more{order:3}
  .chip{order:1}
  .status{order:5!important}
  .mpop.left{left:12px}
  .mpop.right{right:12px}
}
@media (max-height:500px) and (orientation:landscape){
  .status{order:2!important;flex:1;min-width:0}
  #undo{flex:0 0 auto;order:3;padding:0 22px}
  #more{order:4}
}
@media (orientation:landscape) and (min-height:501px) and (max-width:1199px){
  .bar{flex-wrap:wrap}
  .status{order:3;flex-basis:100%}
  .tools{margin-left:auto}
}
@media (orientation:portrait){
  .bar{flex-wrap:wrap}
  .status{order:3;flex-basis:100%}
  .tools{margin-left:auto}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="tbtn chip" id="modeChip" aria-haspopup="true" aria-expanded="false"><span id="modeLbl">Tennis</span><span class="car">&#9662;</span></button>
    <div class="seg" id="sportSeg">
      <button data-sport="tennis">Tennis</button>
      <button data-sport="pickle">Pickleball</button>
      <button data-sport="custom">Custom</button>
    </div>
    <div class="status"><div class="main" id="stMain"></div><div class="sub" id="stSub"></div></div>
    <div class="tools">
      <button class="tbtn" id="undo" aria-label="Undo last point">&#8630; Undo</button>
      <button class="tbtn" id="players" aria-label="Players">Players</button>
      <button class="tbtn" id="help" aria-label="Rules">?</button>
      <button class="tbtn" id="settings" aria-label="Settings">&#9881;</button>
      <button class="tbtn" id="swap" aria-label="Swap sides" title="Swap sides">&#8644;</button>
      <button class="tbtn reset" id="reset">Reset</button>
      <button class="tbtn" id="more" aria-label="More" aria-haspopup="true" aria-expanded="false">&#8943;</button>
    </div>
    <div class="mpop" id="pop" role="menu"></div>
  </header>
  <main class="board" id="board"></main>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/*LOGIC*/
const DEFAULT_NAMES = ['Team A', 'Team B'];

function newTennis(o) {
  o = o || {};
  return { bestOf: o.bestOf || 3, noAd: !!o.noAd, sets: [], g: [0, 0], p: [0, 0],
           tb: false, tbStart: 0, server: 0, winner: null };
}
function newPickle(o) {
  o = o || {};
  return { target: o.target || 11, winBy2: o.winBy2 !== false, cap: o.cap || 0, bestOf: o.bestOf || 1,
           serveMode: o.serveMode || 'off', singles: !!o.singles, games: [], gw: [0, 0], p: [0, 0],
           startSrv: 0, srv: 0, num: 2, winner: null, pos: [0, 0], sp: 0, rs: [0, 0], ms: 0 };
}
function newState() {
  return { sport: 'tennis', swap: false, rot: null, roster: null, names: DEFAULT_NAMES.slice(), tennis: newTennis(), pickle: newPickle(), custom: newPickle({ target: 21 }) };
}

function tennisSetsWon(t) {
  const w = [0, 0];
  t.sets.forEach(s => { w[s.g[0] > s.g[1] ? 0 : 1]++; });
  return w;
}
function tennisWinSet(t, w, viaTb) {
  const l = 1 - w;
  let entry;
  if (viaTb) {
    const g = [0, 0]; g[w] = 7; g[l] = 6;
    entry = { g: g, tb: [t.p[0], t.p[1]] };
    t.server = 1 - t.tbStart;
  } else {
    entry = { g: t.g.slice(), tb: null };
  }
  t.sets.push(entry);
  t.g = [0, 0]; t.p = [0, 0]; t.tb = false;
  const won = tennisSetsWon(t);
  if (won[w] >= Math.ceil(t.bestOf / 2)) t.winner = w;
  else t.last = { w: w, n: t.sets.length, score: entry.g.slice() };
}
function tennisPoint(t, w) {
  if (t.winner !== null) return false;
  t.last = null;
  const l = 1 - w;
  t.p[w]++;
  if (t.tb) {
    if (t.p[w] >= 7 && t.p[w] - t.p[l] >= 2) { tennisWinSet(t, w, true); return true; }
    if ((t.p[0] + t.p[1]) % 2 === 1) t.server = 1 - t.server;
    return true;
  }
  const gameWon = t.noAd ? t.p[w] >= 4 : (t.p[w] >= 4 && t.p[w] - t.p[l] >= 2);
  if (gameWon) {
    t.g[w]++; t.p = [0, 0]; t.server = 1 - t.server;
    if (t.g[w] >= 6 && t.g[w] - t.g[l] >= 2) tennisWinSet(t, w, false);
    else if (t.g[0] === 6 && t.g[1] === 6) { t.tb = true; t.tbStart = t.server; }
  }
  return true;
}
function tennisPointLabel(t, i) {
  if (t.tb) return String(t.p[i]);
  const a = t.p[i], b = t.p[1 - i];
  if (!t.noAd && a >= 3 && b >= 3) { if (a === b) return '40'; return a > b ? 'AD' : '40'; }
  return ['0', '15', '30', '40'][Math.min(a, 3)];
}

function pickPoint(k, w) {
  if (k.winner !== null) return false;
  k.last = null;
  const l = 1 - w;
  if (k.serveMode === 'sideout') {
    if (w !== k.srv) {
      if (!k.singles && k.num === 1) { k.num = 2; k.sp = 1 - k.sp; } else { k.srv = w; k.num = 1; k.sp = k.pos[w]; }
      return true;
    }
  } else if (k.serveMode === 'rally') {
    if (k.srv === w) k.pos[w] = 1 - k.pos[w];   // the serving pair swap sides after winning a point
    k.srv = w;
  }
  if (k.serveMode === 'sideout') k.pos[w] = 1 - k.pos[w];   // reaching here means the serving team won the rally
  k.p[w]++;
  if (k.p[w] >= k.target && (!k.winBy2 || k.p[w] - k.p[l] >= 2 || (k.cap > k.target && k.p[w] >= k.cap))) {
    k.games.push([k.p[0], k.p[1]]);
    k.gw[w]++;
    if (k.gw[w] >= Math.ceil(k.bestOf / 2)) k.winner = w;   // keep the final score on screen
    else { k.p = [0, 0]; k.startSrv = 1 - k.startSrv; k.srv = k.startSrv; k.num = 2; k.rs = [1 - (k.rs || [0, 0])[0], 1 - (k.rs || [0, 0])[1]]; k.pos = k.rs.slice(); k.sp = k.pos[k.srv]; k.last = { w: w, n: k.games.length, score: k.games[k.games.length - 1].slice() }; }
  }
  return true;
}
function tennisPointState(t, i) {
  if (t.winner !== null) return null;
  const l = 1 - i, np = t.p[i] + 1;
  let winsGame, winsSet;
  if (t.tb) { winsSet = np >= 7 && np - t.p[l] >= 2; winsGame = winsSet; }
  else {
    winsGame = t.noAd ? np >= 4 : (np >= 4 && np - t.p[l] >= 2);
    winsSet = winsGame && t.g[i] + 1 >= 6 && t.g[i] + 1 - t.g[l] >= 2;
  }
  if (!winsGame) return null;
  if (!winsSet) return 'game';
  return tennisSetsWon(t)[i] + 1 >= Math.ceil(t.bestOf / 2) ? 'match' : 'set';
}
/* which partner (0 = listed first) serves: rally follows the serving team's score (even: the one on the right), side-out follows server 1/2 */
function pickServerIdx(k) {
  if (k.serveMode === 'rally') return k.p[k.srv] % 2 === 0 ? k.pos[k.srv] : 1 - k.pos[k.srv];
  if (k.serveMode === 'sideout' && !k.singles) return k.sp;
  return -1;
}
function pickCanWin(k, i) {
  if (k.winner !== null) return false;
  if (k.serveMode === 'sideout' && k.srv !== i) return false;
  const np = k.p[i] + 1;
  return np >= k.target && (!k.winBy2 || np - k.p[1 - i] >= 2 || (k.cap > k.target && np >= k.cap));

function pickMatchPoint(k, i) {

             : '<b>Deuce (40-40):</b> win by two points.',
      '<b>Set:</b> first to 6 games, win by 2. At 6-6, tiebreak to 7.',
      '<b>Match:</b> ' + (t.bestOf === 1 ? 'win 1 set.' : 'win ' + Math.ceil(t.bestOf / 2) + ' of ' + t.bestOf + ' sets.')];
    serving = [
      '<b>Two tries.</b> Miss both and you lose the point (double fault).',
      '<b>Diagonal.</b> Serve into the opposite service box. Start on the right, switch sides each point.',
      '<b>Let:</b> a serve that clips the net and lands in is replayed.',
      '<b>Turns:</b> serve changes every game. In a tiebreak, one serve first, then two each.'];
    note = 'Tap the serve tag to choose who serves first.';
  } else {
    const k = S.pickle;
    title = 'Pickleball rules';
    items = [
      '<b>Game:</b> first to ' + k.target + (k.winBy2 ? ', win by 2' + (k.cap > k.target ? ' (first to ' + k.cap + ' wins).' : '.') : '.'),
      '<b>Match:</b> ' + (k.bestOf === 1 ? 'one game.' : 'win ' + Math.ceil(k.bestOf / 2) + ' of ' + k.bestOf + ' games.'),
      '<b>Net:</b> no volleys in the 7-foot "kitchen". Serve and return must bounce first.'];
    serving = [
      '<b>Underhand.</b> Hit the ball below your waist.',
      '<b>Diagonal.</b> The serve must land past the kitchen line in the opposite box.',
      '<b>One try.</b> A serve that clips the net and lands in is played.',
      k.singles ? '<b>Side:</b> serve from the right when your score is even, the left when odd.'
                : '<b>Side:</b> each serving turn starts on the right. Switch sides with your partner after each point you win.'];
    const sideText = k.singles
      ? 'Only the server scores. If the server loses the rally, the opponent serves. Call: your score, their score.'
      : 'Only the server scores. Receivers who win the rally get the serve, no point. Both partners serve first. Call: your score, their score, server 1 or 2.';
    const modes = [
      ['off', 'Off', 'Points only. No serve indicator.'],
      ['rally', 'Rally', 'Every rally scores a point for the winner, who serves next. Serve from the right on an even score, the left on odd.'],
      ['sideout', 'Side-out (traditional)', sideText]];
    note = '<h3 class="mh">Serve tracking</h3>' + modes.map(m =>
      '<div class="mc pick' + (k.serveMode === m[0] ? ' on' : '') + '" data-mode="' + m[0] + '" role="button" tabindex="0" aria-pressed="' + (k.serveMode === m[0]) + '"><div class="mt"><h3>' + m[1] + '</h3>' +
      (k.serveMode === m[0] ? '<span class="sel">Selected</span>' : '<span class="use">Use</span>') +
      '</div><p>' + m[2] + '</p>' +
      (m[0] === 'sideout' && k.serveMode === 'sideout' ? '<div class="seg pl"><button data-pl="doubles" class="' + (k.singles ? '' : 'on') + '">Doubles</button><button data-pl="singles" class="' + (k.singles ? 'on' : '') + '">Singles</button></div>' : '') +
      '</div>').join('');
  }
  openSheet('<h2>' + title + '</h2><p class="sub2">Quick summary. Local rules may differ.</p><ul class="rules">' +
    items.map(i => '<li>' + i + '</li>').join('') + '</ul>' +
    (serving.length ? '<h3 class="mh">Serving</h3><ul class="rules">' + serving.map(i => '<li>' + i + '</li>').join('') + '</ul>' : '') + (note ? (note.charAt(0) === '<' ? note : '<p class="sub2">' + note + '</p>') : '') +
    '<button class="opt ghost" id="hDone">Got it</button>');
  $('hDone').onclick = closeSheet;
  document.querySelectorAll('#sheet .mc.pick').forEach(c => {
    const choose = e => {
      if (e.target.closest('.pl') || S.pickle.serveMode === c.dataset.mode) return;
      act(() => { S.pickle.serveMode = c.dataset.mode; });
      const keep = $('sheet').scrollTop; openRules(); $('sheet').scrollTop = keep;
    };
    c.onclick = choose;
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(e); } };
  });
  document.querySelectorAll('#sheet .pl button').forEach(b => b.onclick = () => {
    act(() => { S.pickle.singles = b.dataset.pl === 'singles'; });
    const keep = $('sheet').scrollTop; openRules(); $('sheet').scrollTop = keep;
  });
}
$('help').onclick = openRules;

/* ---------- wire up ---------- */
$('stSub').onclick = e => { if (e.target.closest('#shufBtn')) { rotShuffle(); return; } (S.rot && S.rot.recorded) ? openPlayers() : openSettings(); };
$('undo').onclick = () => {
  if (!history.length) return;
  S = fixState(JSON.parse(history.pop())); save(); render(); toast('Undone');
};
$('reset').onclick = resetStep1;
$('settings').onclick = openSettings;
$('players').onclick = openPlayers;
function swapSides() { S.swap = !S.swap; save(); render(); toast('Sides swapped'); }
$('swap').onclick = swapSides;
const SPORT_NAMES = { tennis: 'Tennis', pickle: 'Pickleball', custom: 'Custom' };
const pop = $('pop');
function closePop() { pop.classList.remove('show'); $('modeChip').setAttribute('aria-expanded', 'false'); $('more').setAttribute('aria-expanded', 'false'); }
function showPop(html, side, btn) {
  const was = pop.classList.contains('show') && pop.dataset.for === btn.id;
  closePop();
  if (was) return;
  pop.innerHTML = html; pop.dataset.for = btn.id;
  pop.className = 'mpop show ' + side; btn.setAttribute('aria-expanded', 'true');
}
$('modeChip').onclick = () => showPop(
  Object.keys(SPORT_NAMES).map(k => '<button role="menuitem" data-sport="' + k + '"' + (S.sport === k ? ' class="on"' : '') + '>' + SPORT_NAMES[k] + (S.sport === k ? '<span class="ck">&#10003;</span>' : '') + '</button>').join(''),
  'left', $('modeChip'));
$('more').onclick = () => showPop(
  (S.sport === 'custom' ? '' : '<button role="menuitem" data-act="rules">Rules</button>') +
  '<button role="menuitem" data-act="swap">Swap sides</button><button role="menuitem" data-act="players">Players</button><button role="menuitem" data-act="settings">Settings</button><button role="menuitem" class="dng" data-act="reset">Reset</button>',
  'right', $('more'));
pop.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  closePop();
  if (b.dataset.sport) { if (S.sport !== b.dataset.sport) { S.sport = b.dataset.sport; save(); render(); } }
  else if (b.dataset.act === 'rules') openRules();
  else if (b.dataset.act === 'swap') swapSides();
  else if (b.dataset.act === 'players') openPlayers();
  else if (b.dataset.act === 'settings') openSettings();
  else if (b.dataset.act === 'reset') resetStep1();
};
document.addEventListener('pointerdown', e => { if (!e.target.closest('#pop,#modeChip,#more')) closePop(); });
document.querySelectorAll('#sportSeg button').forEach(b => b.onclick = () => {
  if (S.sport === b.dataset.sport) return;
  S.sport = b.dataset.sport; save(); render();
});

/* keep the screen awake while scoring */
let wake = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
/* block pinch / double-tap zoom on iOS */
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

let firstVisit = false;
try { firstVisit = localStorage.getItem(KEY) === null; } catch (e) {}
load(); buildBoard(); render(); keepAwake();
function openWelcome() {
  openSheet(`
    <h2>What are you playing?</h2>
    <p>Pick a sport to start. You can switch anytime from the top bar.</p>
    <button class="opt big" data-w="tennis">Tennis<small>Best of 3 sets, Ad scoring, tiebreak at 6&#8209;6.</small></button>
    <button class="opt big" data-w="pickle">Pickleball<small>Games to 11, win by 2.</small></button>
    <button class="opt big" data-w="custom">Custom<small>Choose your own winning points.</small></button>
    <p class="sub2" style="text-align:center;margin-top:10px">Tap the settings under the score anytime to change them.</p>`);
  document.querySelectorAll('#sheet [data-w]').forEach(b => b.onclick = () => {
    S.sport = b.dataset.w; save(); render(); openPlayerSetup(true, { lock: true });
  });
}
const lastAt = S.at || 0;
if (firstVisit) { save(); openWelcome(); }
else if (lastAt && Date.now() - lastAt > 4 * 3600 * 1000) openPlayerSetup(true, { cont: true, note: 'New session? Your last players are filled in.' });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
/* pick up new versions: Home Screen apps resume without reloading, so check when the app comes back to the front */
const APP_VERSION = '20261126024905';
function checkUpdate() {
  if (!location.protocol.startsWith('http') || APP_VERSION.indexOf('BUILD') >= 0) return;
  if ($('scrim').classList.contains('show')) return;   // never reload under an open sheet
  fetch('./index.html?u=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    const m = t.match(/APP_VERSION = '(\d+)'/);
    if (!m || m[1] === APP_VERSION) return;
    try { if (sessionStorage.getItem('cs.upd') === m[1]) return; sessionStorage.setItem('cs.upd', m[1]); } catch (e) {}
    location.replace(location.pathname + '?v=' + m[1]);   // a new address skips any cached copy
  }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setTimeout(checkUpdate, 1500);
</script>
</body>
</html>
